# Self-Upgrade Agent Configuration
# Version: 1.1.0 (2026-06-30)

research:
  keywords:
    - "agent"
    - "reinforcement learning"
    - "LLM reasoning"
    - "tool use"
    - "multi-agent"
    - "chain of thought"
    - "self-improving"
    - "prompt engineering"
    - "planning"
    - "reasoning"
    - "memory"
    - "reflection"
    - "RAG"
    - "fine-tuning"
    - "agent benchmark"
  categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.MA
    - cs.SE
  max_papers_per_query: 10  # reduced from 25 to keep filter phase fast
  sort_by: submittedDate
  lookback_days: 90
  multi_source: true     # arXiv + S2 + PwC + GitHub
  arxiv_selenium_first: true

filter:
  min_abstract_score: 3.0
  min_applicability_score: 2.0
  min_novelty_score: 0.0
  max_papers_to_consider: 5  # raised from 3 in v1.5.0 (ISS-001)

implement:
  max_attempts: 3
  validate_before_install: true
  backup_existing_skill: true

evaluate:
  mode: llm           # llm | simulated
  trials_per_test: 1   # 1 trial × 21 tasks = 21 LLM calls per arm (was 3 → 63, too slow with key rotation)
  timeout_seconds: 120

lifecycle:
  enabled: true
  max_active_skills: 10
  eval_interval_days: 7
  inactivity_days: 30
  min_context_budget: 4000

decide:
  min_success_rate_delta: 0.05
  max_cost_increase_ratio: 1.2
  min_response_quality_delta: 0.1

pipeline:
  schedule: manual
  max_upgrades_per_cycle: 2
  require_manual_approval: false
  auto_promote: false     # true=自动部署, false=生成候选手动审批
  log_level: INFO

database:
  path: upgrades/history.db
